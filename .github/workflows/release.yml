name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run astral:build
      - run: npm run astral:typecheck
      - run: npm run astral:lint
      - run: npm run astral:test
      - run: npm run astral:test:e2e
      - name: Verify release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - run: npm run astral:prepare-runner -- --backend cpu
      - run: npm run astral:package
      - name: Test packaged startup
        run: node astral/scripts/benchmark-startup.mjs release/win-unpacked/Astral.AI.exe .cache/release-smoke
      - name: Create draft and upload downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag --json isDraft > .cache/release-status.json 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not (Get-Content .cache/release-status.json | ConvertFrom-Json).isDraft) { throw 'This version is already published' }
          } else {
            gh release create $tag --verify-tag --draft --title "Astral.AI $version" --notes-file astral/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          }
          gh release upload $tag "release/Astral.AI-$version-x64-setup.exe" "release/Astral.AI-$version-x64-portable.zip" "release/Astral.AI-$version-source.zip" release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release files' }
